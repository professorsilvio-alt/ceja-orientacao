name: Sync HorÃ¡rios dos Professores

on:
  # Executa todo dia Ãºtil Ã s 09:00 UTC = 06:00 horÃ¡rio de BrasÃ­lia
  schedule:
    - cron: '0 9 * * 1-5'

  # Permite rodar manualmente pelo painel Actions do GitHub
  workflow_dispatch:

jobs:
  sync-horarios:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do repositÃ³rio
        uses: actions/checkout@v4

      - name: Baixar e processar horÃ¡rios da planilha
        id: sync
        run: |
          python3 << 'PYEOF'
          import urllib.request, csv, json, re, io, hashlib, sys, os

          SPREADSHEET_ID = '1a2XewE5KNuadI8zUbi15r5n06roJb-wa'

          ABAS = [
            { 'dia': 'Segunda-feira', 'gid': '765921185'  },
            { 'dia': 'TerÃ§a-feira',   'gid': '222847853'  },
            { 'dia': 'Quarta-feira',  'gid': '349244144'  },
            { 'dia': 'Quinta-feira',  'gid': '642475882'  },
            { 'dia': 'Sexta-feira',   'gid': '1997803226' },
          ]

          COLUNAS = [
            { 'disciplina': 'MatemÃ¡tica',         'local': 'Cabine de MatemÃ¡tica' },
            { 'disciplina': 'PortuguÃªs',           'local': 'Cabine de Linguagens' },
            { 'disciplina': 'InglÃªs',              'local': 'Cabine de Linguagens' },
            { 'disciplina': 'Espanhol',            'local': 'Cabine de Linguagens' },
            { 'disciplina': 'EducaÃ§Ã£o ArtÃ­stica',  'local': 'Cabine de Linguagens' },
            { 'disciplina': 'EducaÃ§Ã£o FÃ­sica',     'local': 'Cabine de Linguagens' },
            { 'disciplina': 'CiÃªncias/Biologia',   'local': 'Cabine de CiÃªncias da Natureza' },
            { 'disciplina': 'FÃ­sica',              'local': 'Cabine de CiÃªncias da Natureza' },
            { 'disciplina': 'QuÃ­mica',             'local': 'Cabine de CiÃªncias da Natureza' },
            { 'disciplina': 'HistÃ³ria',            'local': 'Cabine de CiÃªncias Humanas' },
            { 'disciplina': 'Geografia',           'local': 'Cabine de CiÃªncias Humanas' },
            { 'disciplina': 'Sociologia',          'local': 'Cabine de CiÃªncias Humanas' },
            { 'disciplina': 'Filosofia',           'local': 'Cabine de CiÃªncias Humanas' },
          ]

          NOMES_MAP = {
            'Leandro':            'Prof. Leandro',
            'Jordan':             'Prof. Jordan',
            'Arlindo':            'Prof. Arlindo',
            'Vitor':              'Prof. Vitor',
            'Sandra':             'Profª Sandra',
            'Luciana Cavalcante': 'Profª Luciana Cavalcante',
            'Luciana':            'Profª Luciana',
            'Daniela':            'Profª Daniela',
            'Rafael Souza':       'Prof. Rafael Souza',
            'Wanderley':          'Prof. Wanderley',
            'Thalles':            'Prof. Thalles',
            'Eliane':             'Profª Eliane',
            'Elaine':             'Profª Elaine',
            'Viviane':            'Profª Viviane',
            'Marcela':            'Profª Marcela',
            'Alessandra':         'Profª Alessandra',
            'Delma':              'Profª Delma',
            'ElÃ¡zaro':            'Prof. ElÃ¡zaro',
            'Elazaro':            'Prof. ElÃ¡zaro',
            'Leonardo':           'Prof. Leonardo',
            'Xunei':              'Prof. Xunei',
            'MÃ¡rio':              'Prof. MÃ¡rio',
            'Mario':              'Prof. MÃ¡rio',
            'Carlos Laurindo':    'Prof. Carlos Laurindo',
            'Fabiane':            'Profª Fabiane',
            'Vitor Vasconcelos':  'Prof. Vitor Vasconcelos',
            'David':              'Prof. David',
            'JosÃ© Carlos':        'Prof. JosÃ© Carlos',
            'Jose Carlos':        'Prof. JosÃ© Carlos',
            'Rafael Maia':        'Prof. Rafael Maia',
            'Fernando':           'Prof. Fernando',
          }

          def fetch_csv(gid):
            url = f'https://docs.google.com/spreadsheets/d/{SPREADSHEET_ID}/export?format=csv&gid={gid}'
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req, timeout=30) as r:
              return r.read().decode('utf-8')

          def normalize_name(raw):
            name = re.sub(r'\s+\d+$', '', raw).strip()
            cap = ' '.join(
              w if w.lower() in ('de','da','do','dos','das','e') else w.capitalize()
              for w in name.split()
            )
            return NOMES_MAP.get(cap, f'Prof. {cap}')

          def parse_aba(csv_text, dia):
            reader = csv.reader(io.StringIO(csv_text))
            rows = list(reader)
            header_idx = next(
              (i for i, r in enumerate(rows) if r and re.match(r'HOR[AÃ]RIOS', r[0].strip(), re.I)),
              -1
            )
            if header_idx == -1:
              print(f'  [{dia}] CabeÃ§alho nÃ£o encontrado')
              return []
            entradas = []
            for row in rows[header_idx + 1:]:
              if not row: continue
              m = re.match(r'(\d{2}:\d{2})\s*/\s*(\d{2}:\d{2})', row[0].strip())
              if not m: continue
              inicio, fim = m.group(1), m.group(2)
              for c in range(1, 14):
                if c >= len(row): continue
                cell = row[c].strip().replace('\n', ' / ')
                if not cell or cell == 'FECHADA': continue
                for nome_raw in cell.split('/'):
                  nome_raw = nome_raw.strip()
                  if nome_raw and nome_raw != 'FECHADA':
                    entradas.append({'inicio': inicio, 'fim': fim, 'col': c-1, 'nome': normalize_name(nome_raw)})
            return entradas

          def build_horarios(todos):
            mapa = {}
            for item in todos:
              for e in item['entradas']:
                col = e['col']
                if col >= len(COLUNAS): continue
                k = (e['nome'], item['dia'], col)
                if k not in mapa:
                  mapa[k] = {'nome': e['nome'], 'dia': item['dia'],
                              'disciplina': COLUNAS[col]['disciplina'],
                              'local': COLUNAS[col]['local'], 'slots': []}
                mapa[k]['slots'].append((e['inicio'], e['fim']))
            prof_map = {}
            for item in mapa.values():
              nome = item['nome']
              if nome not in prof_map:
                prof_map[nome] = {'nome': nome, 'foto': '', 'disciplinas': set(), 'horarios': []}
              p = prof_map[nome]
              p['disciplinas'].add(item['disciplina'])
              ss = sorted(item['slots'])
              entry = {'dia': item['dia'], 'inicio': ss[0][0], 'fim': ss[-1][1], 'local': item['local']}
              if entry not in p['horarios']:
                p['horarios'].append(entry)
            ORDEM = ['Segunda-feira','TerÃ§a-feira','Quarta-feira','Quinta-feira','Sexta-feira']
            result = []
            for nome in sorted(prof_map):
              p = prof_map[nome]
              p['horarios'].sort(key=lambda h: (ORDEM.index(h['dia']) if h['dia'] in ORDEM else 9, h['inicio']))
              result.append({'nome': p['nome'], 'foto': '', 'disciplinas': sorted(p['disciplinas']), 'horarios': p['horarios']})
            return result

          def gerar_bloco_js(horarios):
            lines = ['[']
            for i, p in enumerate(horarios):
              vc = ',' if i < len(horarios)-1 else ''
              lines.append('    {')
              lines.append(f'      nome: {json.dumps(p["nome"], ensure_ascii=False)},')
              lines.append(f'      foto: "",')
              discs = ', '.join(json.dumps(d, ensure_ascii=False) for d in p['disciplinas'])
              lines.append(f'      disciplinas: [{discs}],')
              lines.append('      horarios: [')
              for j, h in enumerate(p['horarios']):
                vh = ',' if j < len(p['horarios'])-1 else ''
                lines.append(f'        {{ dia: {json.dumps(h["dia"], ensure_ascii=False)}, inicio: "{h["inicio"]}", fim: "{h["fim"]}", local: {json.dumps(h["local"], ensure_ascii=False)} }}{vh}')
              lines.append('      ]')
              lines.append(f'    }}{vc}')
            lines.append('  ]')
            return '\n'.join(lines)

          # â”€â”€ EXECUÃ‡ÃƒO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
          print('=== CEJA - Sync de HorÃ¡rios ===')
          todos_dados = []
          for aba in ABAS:
            print(f'  {aba["dia"]}...', end=' ', flush=True)
            csv_text = fetch_csv(aba['gid'])
            entradas = parse_aba(csv_text, aba['dia'])
            todos_dados.append({'dia': aba['dia'], 'entradas': entradas})
            print(f'OK ({len(entradas)} entradas)')

          print(f'\n  Consolidando...')
          novo = build_horarios(todos_dados)
          print(f'  {len(novo)} professores\n')

          with open('dados_escola.js', 'r', encoding='utf-8-sig') as f:
            conteudo = f.read()

          novo_bloco = gerar_bloco_js(novo)
          hash_novo  = hashlib.sha256(novo_bloco.encode()).hexdigest()

          MARKER_START = '// HORARIOS_SYNC_START'
          MARKER_END   = '// HORARIOS_SYNC_END'

          if MARKER_START not in conteudo or MARKER_END not in conteudo:
            print('ERRO: Marcadores HORARIOS_SYNC nao encontrados em dados_escola.js!')
            sys.exit(1)

          # Extrai o bloco atual entre os marcadores para comparacao de hash
          start_pos = conteudo.index(MARKER_START) + len(MARKER_START)
          end_pos   = conteudo.index(MARKER_END)
          bloco_atual = conteudo[start_pos:end_pos].strip()
          hash_atual  = hashlib.sha256(bloco_atual.encode()).hexdigest()

          if hash_atual == hash_novo:
            print('Sem alteraÃ§Ãµes detectadas.')
            with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('houve_mudanca=false\n')
            sys.exit(0)

          print('AlteraÃ§Ãµes detectadas! Atualizando dados_escola.js...')
          novo_conteudo = (
            conteudo[:conteudo.index(MARKER_START) + len(MARKER_START)]
            + '\n  horarioProfessores: ' + novo_bloco + ',\n  '
            + conteudo[conteudo.index(MARKER_END):]
          )
          with open('dados_escola.js', 'w', encoding='utf-8-sig') as f:
            f.write(novo_conteudo)

          print('dados_escola.js atualizado!')
          for p in novo:
            print(f'  â€¢ {p["nome"]} | {", ".join(p["disciplinas"])}')

          # Sinaliza COM mudanÃ§a para o step seguinte
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write('houve_mudanca=true\n')
          PYEOF

      - name: Commit e Push (somente se houve mudanÃ§a)
        if: steps.sync.outputs.houve_mudanca == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados_escola.js
          git commit -m "ðŸ• Sync horÃ¡rios automÃ¡tico - $(date '+%d/%m/%Y %H:%M')"
          git push
